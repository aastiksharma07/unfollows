[project]
name = "unfollows"
version = "1.0.0"
description = "Find Instagram accounts you follow that don't follow you back."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
unfollows = "unfollows:main"

[project.urls]
Homepage = "https://unfollows.aastikz.me"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["unfollows"]
